[project]
name = "lm-gateway"
version = "1.0.0"
description = "OpenAI-compatible local gateway for enterprise LLM subscriptions"
authors = [{ name = "Carmelo Battiato" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "openai", "gateway", "proxy", "agentic", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "uvicorn>=0.35.0,<1.0.0",
    "websockets>=12.0,<15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
lm-gateway = "lmgateway.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmgateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
